.production-chain{display:flex;flex-direction:column;gap:7px;padding:13px}.chain-unit{display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%;padding:12px 14px}.chain-unit .label{min-width:110px}.chain-unit .date{margin-top:0;flex:1}.chain-unit .tools{margin-top:0}.chain-unit .tools button{padding:5px 2px}
.focus-item.finished-focus,.week-item.completed{background:#f5f6f3;border-color:#e9ece8;opacity:.74}
/* v0.2: restrained selection controls, compact content lanes, muted completed work */
.delivery-select{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:5px}
.delivery-option{display:block;position:relative;cursor:pointer}
.delivery-option input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.delivery-option span{display:block;padding:13px 14px;text-align:center;border:1px solid var(--line);border-radius:10px;background:#fff;color:#53635c;font-size:13px;font-weight:650;transition:background .15s,border-color .15s}
.delivery-option input:checked+span{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.delivery-option input:focus-visible+span{outline:3px solid #a4c9be;outline-offset:2px}
.type-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:8px 0}
.type-card{min-height:46px;padding:10px 4px;display:grid;place-items:center;text-align:center;font-weight:650;font-size:13px;border-radius:9px;line-height:1.35}
.type-card.selected{background:var(--accent-soft);border-color:var(--accent)}
.track-head{align-items:center}
.step-link{appearance:none;border:0;background:transparent;padding:0;text-align:left;color:var(--ink);font-size:13px;font-weight:750;cursor:pointer}
.step-link:hover{color:var(--accent);text-decoration:underline}
.step-item.is-finished,.chain-unit.is-finished{background:#f4f5f3;color:#89928e}
.step-item.is-finished{border-radius:9px;padding:11px 8px;margin:4px -8px 0;opacity:.7}
.step-item.is-finished .step-link,.chain-unit.is-finished .step-link{color:#8b948e}
.step-item.is-finished .bar-inner{background:#bbc3be}
.chain-unit.is-finished{order:99;opacity:.72}
.chain-unit.is-finished+.arrow{opacity:.25}
.muted-pill{color:#737c77;background:#e7eae7;margin-left:5px}
.mark-done{margin-top:15px;border-top:1px solid var(--line);padding-top:15px;display:grid;gap:5px}
.done-check{display:flex;gap:10px;align-items:center;font-weight:650;font-size:13px;cursor:pointer}
.done-check input{accent-color:var(--accent);width:18px;height:18px}
.mark-done small{font-size:11px;padding-left:28px}
@media(max-width:540px){.type-grid{gap:4px}.type-card{font-size:12px;padding:9px 2px;min-height:44px}}

  border-color:#d8dedb;border-radius:3px;
  background:var(--panel);
  box-shadow:none;
}
.pane{border-top:2px solid #394e53}
.pane-heading{border-bottom-color:#dbe0dc;background:rgba(247,248,245,.7)}
.pane-title{font-family:var(--serif);font-weight:650;letter-spacing:.4px;color:#25373b}
.metric .num,.metric .label{font-variant-numeric:tabular-nums}
.metric .num{font-family:var(--serif);color:#2f4246}
.metric.warn{background:#faf6f3;border-color:#e4d7d1}
.metric.warn .num{color:#9d4740}
.detail-hero{border-top:2px solid #36484d}
.detail-hero h2,.item-title,.track-name,.section-head h2{font-family:var(--serif);font-weight:650;letter-spacing:.3px}
.track-card{border-left:2px solid #8a9b9b}
.bar{background:#e3e8e5;border-radius:1px;height:5px}
.bar-inner,.today-bar>span{background:#536e68;border-radius:0}
.pill{background:#eff1ee;color:#62716f;border-radius:2px}
.pill.green{background:#e9eeeb;color:#416a5d}
.pill.orange{background:#f6f0e7;color:#886c43}
/* Calendar: ruled paper + precise red seal for today */
.unified-calendar .calendar-toolbar{background:var(--panel);padding:22px 22px 18px}
.cal-month{font-family:var(--serif);font-weight:650;font-size:21px;color:#203035;letter-spacing:.65px}
.calendar-filter,.mode-tabs,.calendar-view-picker{background:#edeFEB;border:1px solid #dce1dd;border-radius:2px;padding:3px;gap:2px}
.calendar-filter button,.mode-tab,.calendar-view-picker button{border-radius:1px;color:#687676;font-size:12px;letter-spacing:.2px}
.calendar-filter button[aria-pressed="true"],.mode-tab.active,.calendar-view-picker button[aria-pressed="true"]{background:#34464b;color:#fff;box-shadow:none}
.calendar-filter button:hover:not([aria-pressed="true"]){background:#dfe5e1}
.cal-hint{border-top:1px solid #e0e4e1;background:#f9faf8;color:#6f7b79}
.legend-dot{border-radius:0;width:7px;height:7px}
.weekdays{background:#f0f3f0}
.weekdays div{font-family:var(--serif);color:#576769;padding:13px 3px;letter-spacing:.4px}
.calendar-grid{background:#dce2de;gap:1px;border-top:1px solid #d8deda}
.calendar-grid .day{border:0;background:#fcfcfa;min-height:142px}
.calendar-grid .day.faded{background:#f5f6f3}
.calendar-grid .day.today{background:#f7f9f6}
.calendar-grid .day.selected{outline:1px solid #94a9a7;outline-offset:-1px}
.unified-calendar .clean-day{height:147px;padding:7px 6px}
.day-date{color:#8b9898;margin-bottom:8px}
.day-date strong{font-family:var(--serif);font-size:12px;font-weight:650;width:27px;height:27px;color:#2a3538}
.day.today .day-date strong{background:#a04440;color:#fffaf3;border-radius:2px;transform:rotate(-2deg)}
.unified-calendar .day-date-link:hover strong{background:#e6ebe8;color:#293f43;border-radius:2px}
.day-count{color:#859294;font-size:10px}
.calendar-chip{font-family:var(--sans);border-left-width:2px;border-radius:1px!important;font-weight:600;font-size:10px;padding:6px 7px;line-height:1.34}
.calendar-chip:hover,.focus-entry:hover,.week-item:hover{filter:brightness(.96)}
.day-entries{gap:4px}
.tone-red{background:var(--ddl-bg)!important;color:#963b36!important;border-color:var(--ddl)!important}
.tone-blue{background:var(--node-bg)!important;color:#3e6273!important;border-color:var(--node)!important}
.tone-yellow{background:var(--remind-bg)!important;color:#806137!important;border-color:var(--remind)!important}
.tone-green{background:var(--personal-bg)!important;color:#42665b!important;border-color:var(--personal)!important}
.tone-purple{background:#f3f0f6!important;color:#75617d!important;border-color:#786b86!important}
.tone-orange{background:#f7f0e9!important;color:#906344!important;border-color:#a87950!important}
.tone-gray{background:#f0f2f0!important;color:#626e70!important;border-color:#77878a!important}
.more-entries{padding:5px 6px;color:#5f7175;font-weight:650}
.week-item,.focus-entry{border-radius:2px!important}
.week-day{border-color:#dce1dd}
.week-day-head{font-family:var(--serif)}
.week-date.today{color:#923b36}
.week-item{background:#f7f9f7;border-color:#dce3e0}
.week-item .primary-label{color:#39575d}
/* Daily progress */
.progress-header{border-bottom:1px solid #d1d9d5;padding-bottom:17px;margin-bottom:19px}
.progress-header h2{font-family:var(--serif);font-size:25px;letter-spacing:1px;font-weight:650}
.progress-date-controls input{background:#fafbf9;border-color:#cbd4d0;border-radius:2px}
.progress-summary{border-left:2px solid #6e8889;background:#f9faf8;gap:19px}
.progress-summary strong{font-family:var(--serif);color:#26383d;font-weight:650}
.today-task{padding:17px;border-left:2px solid #a5b9b3}
.today-task h3{font-family:var(--serif);font-weight:650;letter-spacing:.15px;color:#203439}
.today-task.completed-work{background:#f4f5f1}
.status-todo,.status-done{border-radius:2px;background:#edf1ee;color:#436258}
.status-done{background:#edf0ed;color:#737d7a}
.today-task-plan strong{color:#2c4246}
.today-bar{border-radius:0;background:#e0e6e2;height:5px}
.today-task.overdue-work{background:#fbf5f2;border-color:#bf8a83}
.overdue-note{color:#994640}
.attention-dot,.upcoming-mark{border-radius:1px}
.upcoming-row,.event-product{background:transparent;color:#42575b}
.upcoming-row:hover,.event-product:hover{background:#eff2ef}
.event-product{border-radius:0}
.alert{background:#faf5f0;border:1px solid #e5d4cc;border-left:2px solid #a24540;color:#8d554b;border-radius:2px}
.inbox-state{background:#f6f1e8;border-radius:2px;color:#846a40}
.inbox-state.urgent{background:#faeeec;color:#9b4841}
/* Forms / small controls / dialogs */
.type-card{background:#fafbf8;min-height:47px}
.type-card.selected{background:#e9edeb;border-color:#546c72;color:#263e44}
.delivery-option span{background:#fafbf9;border-color:#cfd8d3;color:#586969}
.delivery-option input:checked+span{background:#e9eeeb;border-color:#526971;color:#2e4449}
.field label{color:#3a5055}
.field input,.field select,.field textarea{border-color:#cfd7d3;background:#fffefa;border-radius:2px;color:#293d41}
.field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 2px #e6edeb;border-color:#627c80}
.step-link:hover{color:#344f54}
.step-item.is-finished,.chain-unit.is-finished{background:#f0f2ee;color:#798584;border-radius:2px}
.piece-chip{border-radius:2px;color:#647571}
.piece-chip.active{color:#385c57;border-color:#95aea6;background:#e9f0ec}
.reminder-pill,.muted-pill{border-radius:2px}
.modal-layer{background:rgba(24,33,35,.38);backdrop-filter:blur(2px)}
.modal{background:#fcfcf9;border:1px solid #b4c0bd;border-radius:3px;box-shadow:0 24px 70px rgba(18,31,34,.24)}
.modal-top{border-bottom:1px solid #e2e6e2;background:#f8f9f6;padding:22px 25px 16px;position:relative}
.modal-top:before{content:"";position:absolute;left:0;top:20px;bottom:18px;width:3px;background:#9d4541}
.modal-top h2{font-family:var(--serif);font-weight:650;font-size:21px;letter-spacing:.3px}
.modal-foot{background:#f8f9f6}
.xbtn{color:#54676a}
.mark-done{border-top-color:#dce2df}
.done-check input{accent-color:#48675f}
.toast{border-radius:2px;background:#29393d;color:#fafbf7;box-shadow:var(--shadow)}
/* Info-density: legibility in lists and badges */
.calendar-chip,.step-details,.attention-body small,.day-task,.recent-entry,.upcoming-row{letter-spacing:.05px}
.slim-track-header,.slim-step,.inbox-row{border-color:#dce2df}
.slim-track-header:hover,.slim-step:hover{background:#f6f8f5}
/* Mobile: preserve the sober typography, avoid squeezed controls */
@media (max-width:1100px){
 .main{padding-top:24px}
 .topbar{margin-bottom:20px}
}
@media (max-width:860px){
 .main{padding:21px 15px 100px}
 .topbar{padding-bottom:14px}
 .page-title{font-size:25px}
 .unified-calendar .calendar-toolbar{padding:15px 13px}
 .cal-month{font-size:19px}
 .calendar-filter{display:flex}
 .calendar-filter button{min-height:37px}
 .calendar-view-picker{background:#e9eeea}
 .mobile-nav{background:#f9faf7;border-top:1px solid #cbd4cf;box-shadow:0 -4px 20px rgba(28,40,43,.04)}
 .mobile-nav button.selected{color:#913e3a}
 .mobile-nav button{color:#657477}
 .mobile-submenu button{border-radius:2px;color:#58696e;background:#fafbf9}
 .mobile-submenu button.active{background:#e9eeea;color:#30484c;border-color:#9aaba7}
 .week-agenda{background:#fcfcfa}
 .week-day{padding:16px 13px}
 .progress-header h2{font-size:22px}
}
@media (max-width:520px){
 .page-title{font-size:23px}
 .unified-calendar .clean-day{height:115px;padding:5px 3px}
 .day-date strong{height:23px;width:23px}
 .calendar-chip{padding:4px 3px;font-size:9px}
 .calendar-filter button{padding:9px 6px}
 .modal-top{padding:18px 17px 13px}
 .modal-top:before{top:17px;bottom:13px}
 .progress-summary{padding:13px 15px}
 .progress-date-controls input{max-width:150px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

    const transit = nonneg(req.transitDays, '运输提前天数');
    const buffer = nonneg(req.handoffBufferDays, '寄出前缓冲天数');
    const latestDispatch = addDate(receipt, -transit);
    const latestProductReady = addDate(latestDispatch, -buffer);

      const predecessors = (s.predecessors || []).map(p => rows[p]);
      if (predecessors.some(p => !p.forecastFinish)) {
        row.forecastConfidence = 'blocked';

        continue;

      const earliest = maxDate(now, ...predecessors.map(p => addDate(p.forecastFinish, 1)));
      const minExpected = addDate(earliest, s.days - 1);

        ? maxDate(minExpected, s.promisedDelivery) : minExpected;

      row.forecastConfidence = s.durationProvisional ? 'provisional' : 'estimated';
      row.slackDays = daysBetween(forecast, row.latestFinish);
      if (forecast > row.latestFinish) emit('predicted_late', id, {days: daysBetween(row.latestFinish, forecast)});
      if (s.durationProvisional) emit('unquantified_duration', id);

    if (actualDispatch) {
      if (actualDispatch > latestDispatch) emit('late_dispatch', null, {days: daysBetween(latestDispatch, actualDispatch)});
      if (steps.some(s => !s.completed)) emit('dispatched_with_incomplete_steps', null, {stepIds: steps.filter(s => !s.completed).map(s => s.id)});
      if (steps.some(s => s.completed && !s.actualFinished)) emit('dispatched_with_unknown_dates', null);
    }
    if (actualReceipt && actualReceipt > receipt) emit('late_receipt', null, {days: daysBetween(receipt, actualReceipt)});

      predictedReceiptFromDispatch: actualDispatch ? addDate(actualDispatch, transit) : null,
      rows, order, diagnostics

  // Integer micro-units make even fractional P quantities sum exactly; partial pages use quantum=0.5.
  function allocateQuantity({total, initialDone = 0, logs = [], unit = 1, start, finish, excludedDates = []}) {

 const matching=data.logs.filter(l=>l.productId===p.id&&ids.has(l.stepId)&&(l.pieceIds||[]).includes(pieceId)&&!l.deleted&&!l.voided);
 return matching.map(l=>l.date).filter(Boolean).sort().at(-1)||null;
}
function pieceEffectiveDate(p,piece,phase){
 const manual=piece.manualPhases?.[phase]||null;
 const logged=pieceStageLogDate(p,piece.id,phase);
 return [manual,logged].filter(Boolean).sort().at(-1)||null;
}
// One source of truth: explicit manual confirmation and valid log allocations.
// A deleted log cannot erase a later manual confirmation.
function syncPieceProgress(p){
 if(!Array.isArray(p.pieces))return;
 for(const piece of p.pieces)for(const phase of ['sketch','color','refine'])piece[phase]=!!pieceEffectiveDate(p,piece,phase);
 for(const st of p.tracks.flatMap(t=>t.steps).filter(st=>st.pieceStage)){
  st.total=p.pieces.length;
  const dates=p.pieces.map(piece=>pieceEffectiveDate(p,piece,st.pieceStage));
  st.completed=false; // quantity completion is derived from all pieces, never from a global checkbox
  st.completedAt=dates.length>0&&dates.every(Boolean)?dates.sort().at(-1):null;
 }
}
function stepDone(p,s){if(s.pieceStage&&Array.isArray(p.pieces))return p.pieces.filter(x=>x[s.pieceStage]).length;return Math.max(0,nval(s.done)+sumLogged(s.id))}
function doneStep(p,s){return !!s.completed || (s.kind==='quantity'&&stepDone(p,s)>=nval(s.total))}
function remaining(p,s){return Math.max(0,nval(s.total)-stepDone(p,s))}
function stepRateText(s){if(!nval(s.unitMinutes))return '';const base=s.unit==='字'?1000:1;return `${formatHours(nval(s.unitMinutes)*base)} / ${base===1000?'1000':''}${s.unit||'单位'}`}
function daysOf(a,b){return dayDiff(a,b)+1}
function allocateDays(total,weights){const n=weights.length;if(!n)return [];const min=total>=n?1:0;const alloc=Array(n).fill(min);let left=Math.max(0,total-n*min);const w=weights.map(x=>Math.max(.001,x));const sum=w.reduce((a,b)=>a+b,0);const remainders=w.map(x=>left*x/sum);const base=remainders.map(Math.floor);let allocated=base.reduce((a,b)=>a+b,0);for(let i=0;i<n;i++)alloc[i]+=base[i];for(const i of remainders.map((v,i)=>({i,r:v-base[i]})).sort((a,b)=>b.r-a.r).map(x=>x.i)){if(allocated>=left)break;alloc[i]++;allocated++}return alloc}
function p0Compute(p,now=todayISO()){
 const event=eventBy(p.eventId);if(!event)return null;

}
function scheduleProduct(p,now=todayISO()){
 const event=eventBy(p.eventId);
 if(!event)return {event:null,shared:[],tracks:[],risk:['尚未关联参展活动'],cards:[],p0:null};
 let r;try{r=p0Compute(p,now)}catch(err){return {event,deadline:event.ddl,shared:[],tracks:[],cards:[],risk:['无法计算排程：'+err.message],p0:null}}
 const d=r.plan, cards=[],risk=[];
 const warningType={missing_actual_date:'已完成但缺少实际完成日',blocked_by_unknown_predecessor:'前置完成日期未知，当前预测受阻',promise_after_latest:'承诺交稿晚于最晚允许日',predicted_late:'按当前进度预计逾期',overdue_promise:'约定交稿日期已过，尚未验收',historically_late:'实际完成晚于要求',completed_before_predecessor:'后续已完成但前置尚未完成',actual_order_conflict:'实际日期顺序冲突',late_dispatch:'实际寄出晚于最晚寄出',dispatched_with_incomplete_steps:'已寄出但生产工序仍未完成',unquantified_duration:'数量任务使用临时预计工期',missing_shipping:'未设置物流工期'};
 for(const x of d.diagnostics){const label=warningType[x.type]||x.type;const ref=x.stepId?stepBy(x.stepId):null;risk.push((ref?.s?.name?ref.s.name+'：':'')+label+(x.days?' '+x.days+' 天':''));}
 for(const w of r.warnings)if(['missing_shipping','unknown_dispatch_date','unknown_actual','inferred_buffer'].includes(w.type))risk.push(w.message);
 if(r.warnings.some(w=>w.type==='auto_duration'))risk.push('存在未填写预计工期的数量任务，已临时分配天数，请核对');
 const trackRows=p.tracks.map(track=>{
   const list=track.steps.map(step=>{
     const row=d.rows[step.id];if(!row)return null;
     const complete=doneStep(p,step),end=row.latestFinish,start=row.latestStart;
     if(!complete&&isMineStep(track,step)&&step.kind==='quantity'){
       const first=row.forecastStart&&row.forecastStart>now?row.forecastStart:now;
       const begin=first>start?first:start;
       const quantity=stepDone(p,step),total=nval(step.total);
       if(begin<=end&&total>quantity){
         try{
           const unit=step.unit==='字'||step.pieceStage?1:0.5;
           const allocated=FandomSchedulerP0.allocateQuantity({total,initialDone:quantity,unit,start:begin,finish:end});
           for(const [date,amount] of Object.entries(allocated.quotas))if(amount>0)cards.push({date,product:p,step,track,kind:'quantity',title:step.name,target:`${cleanN(amount)} ${step.unit||'单位'}`,plan:amount,provisional:row.latestProvisional});
         }catch(ex){risk.push(step.name+'：任务数量格式需检查');}
       }
     }else if(!complete&&isMineStep(track,step)&&step.kind==='fixed'){
       const first=row.forecastStart||now;
       for(let day=first;day<=end&&day<=addDay(now,120);day=addDay(day,1))cards.push({date:day,product:p,step,track,kind:'fixed',title:step.name,target:'阶段任务',plan:0});
     }
     return {step,start,end,days:step.kind==='quantity'?(r.input.steps.find(x=>x.id===step.id)?.days||1):step.days,complete,forecastFinish:row.forecastFinish,forecastConfidence:row.forecastConfidence,actualFinished:row.actualFinished,provisional:row.latestProvisional};
   }).filter(Boolean);
   return {track,steps:list,trackDeadline:list.length?list.at(-1).end:null,earliest:list.find(s=>!s.complete)?.start||null};
 });
 const shared=p.shared.map(step=>{
   const shipping=isShippingStep(step);
   const row=d.rows[step.id];
   return {step,start:shipping?null:row?.latestStart||null,end:shipping?d.latestDispatch:row?.latestFinish||null,
           dispatchDate:shipping?d.latestDispatch:null,shipping,complete:doneStep(p,step),
           forecastFinish:row?.forecastFinish||null,actualFinished:shipping?r.input.actualDispatch:row?.actualFinished||null};
 });
 const trackDeadline=r.contentDue;
 cards.push({date:event.ddl,product:p,step:null,track:null,kind:'deadline',title:'活动收货 DDL',target:fmtDay(event.ddl),plan:0});
 return {event,deadline:event.ddl,trackDeadline,shared,tracks:trackRows,cards,risk:[...new Set(risk)],p0:r};
}
function allSchedules(){return data.products.map(p=>({p,s:scheduleProduct(p)}))}
function allCards(){const cards=allSchedules().flatMap(x=>x.s.cards);const logByDay=new Map();for(const log of data.logs){const key=`${log.date}|${log.stepId}`;const a=logByDay.get(key)||{amount:0,minutes:0,lastNote:'',completed:false};a.amount+=nval(log.amount);a.minutes+=nval(log.minutes);if(log.note)a.lastNote=log.note;a.completed ||= !!log.completedByLog;logByDay.set(key,a)}for(const c of cards)c.logged=logByDay.get(`${c.date}|${c.step?.id}`)||null;
 for(const log of data.logs){if(cards.some(c=>c.date===log.date&&c.step?.id===log.stepId))continue;const ref=stepBy(log.stepId);if(!ref)continue;const k=`${log.date}|${log.stepId}`;if(cards.some(c=>c.history===k))continue;const v=logByDay.get(k);cards.push({date:log.date,product:ref.p,step:ref.s,track:ref.t,kind:'historical',title:ref.s.name,target:ref.s.kind==='quantity'?`已完成 ${cleanN(v.amount)} ${ref.s.unit||''}`:(v.lastNote|| (v.completed?'已完成':'已记录')),plan:0,logged:v,history:k})}
 return cards.sort((a,b)=>a.date.localeCompare(b.date)||Number(a.kind==='historical')-Number(b.kind==='historical'))}

function isMineStep(track,step){if(typeof step?.isMine==='boolean')return step.isMine;if(track)return typeof track.isMine==='boolean'?track.isMine:track.owner==='主催';return step?.kind==='fixed'}
function entryTone(entry){return entry.kind==='deadline'?'red':entry.kind==='reminder'?entry.remindColor||'yellow':entry.kind==='node'?entry.nodeColor||'blue':'green'}
function organizerNodes(){
 const rows=[];
 for(const {p,s} of allSchedules()){
  for(const row of [...s.tracks.flatMap(t=>t.steps.map(x=>({...x,track:t.track}))),...s.shared.map(x=>({...x,track:null}))]){
   if(!row.end&&!row.actualFinished)continue;
   const st=row.step,shipping=!!row.shipping;
   // 主催日历追踪外部交付/下印节点；本人创作量留给「我的」。
   if(row.track&&isMineStep(row.track,st))continue;
   const f=FandomFollowUpP1.stateFor(st,row.end,todayISO(),shipping);
   if(row.complete){f.date=row.actualFinished||st.completedAt||row.end;f.actionable=false;f.bucket=null;f.reminderDate=null;}
   rows.push({p,st,track:row.track,shipping,row,followup:f,history:!!row.complete});
  }
 }

}
function pendingFollowups(now=todayISO()){
 const rows=[];
 for(const x of organizerNodes()){
  const state=FandomFollowUpP1.stateFor(x.st,x.row.end,now,x.shipping);
  if(x.history||!state.actionable)continue;
  rows.push({...x,followup:state});
 }
 const rank={overdue:0,due:1,review:2,revision:3,contact:4};
 return rows.sort((a,b)=>(rank[a.followup.bucket]??9)-(rank[b.followup.bucket]??9) || (a.followup.date||'').localeCompare(b.followup.date||'') || a.p.title.localeCompare(b.p.title));

function allCalendarEntries(){

  if(!f.date)continue;
  items.push({date:f.date,product:p,step:st,track,kind:'node',history:!!row.complete,title:shipping?'最晚寄出':st.name,target:shipping?'最晚寄出':f.status==='submitted'?'待验收':f.status==='revision'?'返修交付':'节点',shipping,nodeColor:st.nodeColor||'blue'});
  if(f.reminderDate && f.status!=='submitted' && !f.hasContact){

  }
 }
 for(const c of allCards()){

 return items.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date)||(rank[a.kind]??9)-(rank[b.kind]??9)||a.product.title.localeCompare(b.product.title));

function personalTodayRows(day){

 for(const c of allCards()){
  if(c.date!==day||!c.step||!isMineStep(c.track,c.step)||!['quantity','fixed','historical'].includes(c.kind))continue;
  const old=m.get(c.step.id);

 // A missed latest finish removes daily quotas but must NOT hide unfinished work.
