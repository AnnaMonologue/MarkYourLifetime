.production-chain{display:flex;flex-direction:column;gap:7px;padding:13px}.chain-unit{display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%;padding:12px 14px}.chain-unit .label{min-width:110px}.chain-unit .date{margin-top:0;flex:1}.chain-unit .tools{margin-top:0}.chain-unit .tools button{padding:5px 2px}
.focus-item.finished-focus,.week-item.completed{background:#f5f6f3;border-color:#e9ece8;opacity:.74}
/* v0.2: restrained selection controls, compact content lanes, muted completed work */
.delivery-select{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:5px}
.delivery-option{display:block;position:relative;cursor:pointer}
.delivery-option input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.delivery-option span{display:block;padding:13px 14px;text-align:center;border:1px solid var(--line);border-radius:10px;background:#fff;color:#53635c;font-size:13px;font-weight:650;transition:background .15s,border-color .15s}
.delivery-option input:checked+span{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.delivery-option input:focus-visible+span{outline:3px solid #a4c9be;outline-offset:2px}
.type-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:8px 0}
.type-card{min-height:46px;padding:10px 4px;display:grid;place-items:center;text-align:center;font-weight:650;font-size:13px;border-radius:9px;line-height:1.35}
.type-card.selected{background:var(--accent-soft);border-color:var(--accent)}
.track-head{align-items:center}
.step-link{appearance:none;border:0;background:transparent;padding:0;text-align:left;color:var(--ink);font-size:13px;font-weight:750;cursor:pointer}
.step-link:hover{color:var(--accent);text-decoration:underline}
.step-item.is-finished,.chain-unit.is-finished{background:#f4f5f3;color:#89928e}
.step-item.is-finished{border-radius:9px;padding:11px 8px;margin:4px -8px 0;opacity:.7}
.step-item.is-finished .step-link,.chain-unit.is-finished .step-link{color:#8b948e}
.step-item.is-finished .bar-inner{background:#bbc3be}
.chain-unit.is-finished{order:99;opacity:.72}
.chain-unit.is-finished+.arrow{opacity:.25}
.muted-pill{color:#737c77;background:#e7eae7;margin-left:5px}
.mark-done{margin-top:15px;border-top:1px solid var(--line);padding-top:15px;display:grid;gap:5px}
.done-check{display:flex;gap:10px;align-items:center;font-weight:650;font-size:13px;cursor:pointer}
.done-check input{accent-color:var(--accent);width:18px;height:18px}
.mark-done small{font-size:11px;padding-left:28px}
@media(max-width:540px){.type-grid{gap:4px}.type-card{font-size:12px;padding:9px 2px;min-height:44px}}

function productModal(){const edit=ui.context?.id?productBy(ui.context.id):null;const draft=ui.context?.draft||(ui.context.draft={type:edit?.type||'novel',count:edit?.type==='novel'?60000:edit?.type==='comic'?32:edit?.type==='artbook'?8:edit?.type==='anthology'?2:1});const t=draft.type;const countLabel=t==='novel'?'预估字数':t==='comic'?'预估 P 数':t==='artbook'?'预计画稿张数':t==='goods'?'设计稿数量':'参与者人数';const countDefault={novel:60000,comic:32,artbook:8,goods:1,anthology:2}[t];return wrapModal(edit?'编辑制品':'新建制品','',`<form id="product-form"><div class="field"><label>制品类型</label><div class="type-grid">${Object.keys(TYPE_NAMES).map(k=>`<button type="button" class="type-card ${t===k?'selected':''}" data-action="choose-type" data-type="${k}" ${edit?'disabled':''}>${TYPE_NAMES[k]}</button>`).join('')}</div></div><div class="field"><label>制品名称 *</label><input name="title" required maxlength="100" value="${escAttr(draft.title??edit?.title??'')}"></div><div class="form-grid"><div class="field"><label>关联参展活动 *</label><select name="eventId" required>${data.events.map(e=>`<option value="${e.id}" ${(draft.eventId||edit?.eventId||data.events[0]?.id)===e.id?'selected':''}>${safe(e.name)} · ${fmtDay(e.ddl)}</option>`).join('')}</select></div>${edit?'':`<div class="field"><label>${countLabel}</label><input name="count" type="number" min="1" max="${t==='artbook'?100:t==='anthology'?60:1000000}" step="1" value="${nval(draft.count,countDefault)}"><small>仅预估，创建后可以修改每个阶段的目标数量。</small></div>`}</div></form>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-product">${edit?'保存修改':'创建制品'}</button>`)}
function trackModal(){const ctx=ui.context||{},p=productBy(ctx.productId),t=p?.tracks.find(x=>x.id===ctx.trackId),isAnthology=p?.type==='anthology';return wrapModal(t?'编辑参与内容':'新增参与内容','',`<form id="track-form">${isAnthology?`<div class="field"><label>内容类型</label><select name="template"><option value="text" ${(t?.category||(t?.steps.some(s=>['草稿','上色','细化'].includes(s.name))?'illustration':'text')||'text')==='text'?'selected':''}>文本</option><option value="illustration" ${(t?.category||(t?.steps.some(s=>['草稿','上色','细化'].includes(s.name))?'illustration':'text'))==='illustration'?'selected':''}>绘图</option></select></div><div class="field"><label>参与者姓名 *</label><input name="owner" required value="${escAttr(t?.owner||'作者A')}"></div>`:`<div class="field"><label>工作内容 *</label><input name="name" required value="${escAttr(t?.name||'新工作内容')}"></div><div class="field"><label>参与者姓名</label><input name="owner" value="${escAttr(t?.owner||'主催')}"></div>${t?'':`<div class="field"><label>预设环节</label><select name="template"><option value="custom">自定义</option><option value="text">文本</option><option value="illustration">绘图</option><option value="cover">封面</option></select></div>`}`}<label class="work-owner-check"><input type="checkbox" name="isMine" value="yes" ${(t?!!t.isMine:false)?'checked':''}> 这是我的工作（显示在「我的」日历）</label></form>`,`<button class="btn" data-action="close-modal">取消</button>${t?'<button class="btn danger" data-action="delete-track">删除</button>':''}<button class="btn primary" data-action="save-track">保存</button>`)}
function stepModal(){const context=ui.context||{},ref=context.stepId?stepBy(context.stepId):null,s=ref?.s||mkStep('新环节','fixed',{days:2}),kind=s.kind;return wrapModal(ref?'编辑工序':'新增制作环节','数量型用于每天的赶稿量；预计工期和等待交付型用于倒排日期。',`<form id="step-form"><div class="field"><label>环节名称 *</label><input name="name" required value="${escAttr(ref?s.name:'新环节')}" maxlength="80"></div><div class="field"><label>环节类型</label><select name="kind" id="step-kind"><option value="quantity" ${kind==='quantity'?'selected':''}>数量进度 · 字数 / P / 张数</option><option value="fixed" ${kind==='fixed'?'selected':''}>预计工期 · 我需要完成</option><option value="external" ${kind==='external'?'selected':''}>等待交付 · 约稿 / 打样 / 大货</option></select></div><div id="qty-fields" class="${kind==='quantity'?'':'hide'}"><div class="form-grid"><div class="field"><label>预计总量</label><input name="total" type="number" min="0" step="0.5" value="${nval(s.total)}"></div><div class="field"><label>单位</label><input name="unit" value="${escAttr(s.unit||'P')}" placeholder="字 / P / 张"></div></div><div class="form-grid"><div class="field"><label>初始已完成量</label><input name="done" type="number" min="0" step="0.5" value="${nval(s.done)}"><small>今日进度会在此基础上累加</small></div><div class="field"><label>每单位预计耗时（小时，可留空）</label><input name="rate" type="number" min="0" step="0.05" value="${s.unitMinutes!=null?cleanN(nval(s.unitMinutes)*(s.unit==='字'?1000:1)/60,3):''}"><small>“字”按每 1000 字计算，其余按每 1 单位</small></div></div><div class="field"><label>预计工期（天，可空）</label><input name="plannedDays" type="number" min="1" step="1" value="${s.plannedDays||''}"><small>空白时按当前剩余日历临时分配，日期仅供参考。</small></div>${s.pieceStage?`<p class="help-note">此阶段与下方逐张画稿清单关联，已完成量由清单决定。</p>`:''}</div><div id="duration-fields" class="${kind==='quantity'?'hide':''}"><div class="field"><label>预计工期（天）</label><input name="days" type="number" min="1" max="365" step="1" value="${Math.max(1,nval(s.days,2))}"><small>按自然日计算；已完成环节仍保留历史与前后依赖。</small></div><label style="font-size:12px"><input name="completed" type="checkbox" ${s.completed?'checked':''}> 已完成 / 已交付</label></div><div class="form-divider"></div><div class="form-grid"><div class="field"><label>提前提醒（天，0 为关闭）</label><input type="number" name="remindDays" min="0" max="365" step="1" value="${s.remindDays===null?0:nval(s.remindDays,7)}"></div><div class="field"><label>节点颜色</label><select name="nodeColor">${[['blue','蓝色'],['purple','紫色'],['gray','灰色'],['green','绿色']].map(([v,l])=>`<option value="${v}" ${(s.nodeColor||'blue')===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="field"><label>提醒颜色</label><select name="remindColor">${[['yellow','黄色'],['orange','橙色'],['purple','紫色']].map(([v,l])=>`<option value="${v}" ${(s.remindColor||'yellow')===v?'selected':''}>${l}</option>`).join('')}</select></div><label class="work-owner-check"><input type="checkbox" name="isMine" value="yes" ${isMineStep(ref?.t,s)?'checked':''}> 这是我的工作（进入每日计划）</label></form>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-step">保存工序</button>`)}

function logModal(){const ctx=ui.context||{},ref=stepBy(ctx.stepId);if(!ref)return '';const s=ref.s,unit=s.unit||'单位';return wrapModal('填写今日进度',`${ref.p.title} · ${s.name}`,`<form id="log-form"><div class="field"><label>时间</label><input type="date" name="date" value="${ctx.date||todayISO()}" required></div>${s.kind==='quantity'?`<div class="field"><label>今日进度（${safe(unit)}）</label><input type="number" name="amount" min="0" step="${unit==='字'||s.pieceStage?'1':'0.5'}" value="0" required><small>填写今日新增的数量。</small></div>`:`<div class="field"><label>今日进度</label><input name="progressText" maxlength="200" placeholder="填写今天完成了什么"></div>`}<div class="field"><label>今日用时（小时）</label><input type="number" name="hours" min="0" step="0.25" placeholder="可留空"></div><div class="mark-done"><label class="done-check"><input name="complete" type="checkbox" ${doneStep(ref.p,s)?'checked':''}><span>标记完成</span></label><small>完成后环节变灰，并排列到本路线末尾。</small></div></form>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-log">保存进度</button>`)}
function reminderModal(){const ref=stepBy(ui.context?.stepId);if(!ref)return '';const s=ref.s;const count=s.remindDays===null?0:nval(s.remindDays,7);return wrapModal('提前提醒',`${ref.p.title} · ${s.name}`,`<form id="reminder-form"><div class="field"><label>提前几天提醒</label><input type="number" name="days" min="0" max="365" step="1" value="${count}" required><small>默认 7 天，填写 0 即关闭。提醒只显示在日历中，当前没有推送通知。</small></div><div class="form-grid"><div class="field"><label>节点颜色</label><select name="nodeColor">${[['blue','蓝色'],['purple','紫色'],['gray','灰色'],['green','绿色']].map(([v,l])=>`<option value="${v}" ${(s.nodeColor||'blue')===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>提醒颜色</label><select name="remindColor">${[['yellow','黄色'],['orange','橙色'],['purple','紫色']].map(([v,l])=>`<option value="${v}" ${(s.remindColor||'yellow')===v?'selected':''}>${l}</option>`).join('')}</select></div></div></form>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-reminder">保存提醒</button>`)}
function nodeModal(){
 const ref=stepBy(ui.context?.stepId);if(!ref)return '';
 const st=ref.s,sch=scheduleProduct(ref.p),row=sch.tracks.flatMap(x=>x.steps).concat(sch.shared).find(x=>x.step?.id===st.id);
 const shipping=!!row?.shipping,due=shipping?row.dispatchDate:row?.end;
 const p0row=sch.p0?.plan.rows[st.id],baseline=data.baselines[ref.p.id]?.dates[st.id];
 const actual=shipping?ref.p.actualDispatch||st.completedAt||'':st.completedAt||'';
 const why=p0row?.latestProvisional?'（临时估算，建议填写预计工期）':'';
 return wrapModal(shipping?'最晚寄出':'交付节点',`${ref.p.title} · ${st.name}`,
 `<div class="node-overview"><div><small>倒排最晚日期</small><strong>${fmtDay(due)}${why}</strong></div><div><small>当前预测</small><strong>${fmtDay(shipping?(ref.p.actualDispatch||due):p0row?.forecastFinish)}</strong></div><div><small>原计划</small><strong>${fmtDay(shipping?data.baselines[ref.p.id]?.latestDispatch:baseline?.latestFinish)}</strong></div></div>
 <form id="node-form"><div class="field"><label>约定交稿日期（可空）</label><input type="date" name="promisedDelivery" value="${escAttr(st.promisedDelivery||'')}" ${shipping?'disabled':''}></div>
 <div class="field"><label>人工确认的最晚日期（可空）</label><input type="date" name="dueBy" value="${escAttr(st.dueBy||'')}" ${shipping?'disabled':''}></div>
 <div class="field"><label>实际完成 / 寄出日期</label><input type="date" name="actualFinished" value="${escAttr(actual)}"><small>留空不代表今天已完成。旧数据的未知日期会保持未知。</small></div>
 <label class="work-owner-check"><input type="checkbox" name="completed" value="yes" ${doneStep(ref.p,st)?'checked':''}> 已确认完成（如未填写日期，将显示日期未知）</label>
 </form>`,
 `<button class="btn" data-action="reminder" data-step="${st.id}">修改提醒</button><button class="btn" data-action="edit-step" data-step="${st.id}">编辑工序</button><button class="btn primary" data-action="save-node">保存节点</button>`);
}
function backupModal(){return wrapModal('数据备份与恢复','当前原型只保存在你的浏览器中；建议定期导出 JSON 备份。',`<div class="rows"><button class="btn" data-action="export">${icon('download')} 下载全部数据 JSON</button><label class="btn" style="cursor:pointer">从 JSON 恢复数据 <input style="display:none" type="file" id="import-file" accept="application/json,.json"></label><button class="btn danger" data-action="clear-data">清空全部数据</button></div><div class="alert">恢复备份会替换当前活动、制品与赶稿记录。当前版本无云同步。</div>`,`<button class="btn" data-action="close-modal">关闭</button>`)}
function helpModal(){return wrapModal('使用说明','',`<div class="help-note" style="font-size:13px"><p>① 先创建参展活动，输入官仓或酒店的最晚签收日期。</p><p>② 创建制品，选择模板、关联活动，并修改工作路线、参与者、目标数量及预计工期。</p><p>③ 全部：仅收货 DDL；主催：节点与提前提醒；我的：仅本人每日任务。制作路线仍按收货 DDL 向前倒排。</p><p>④ 主催可为工作路线及单个节点标记「我的工作」。只有自己的工作需要填写每日进度及用时，其他参与者只记录交付节点。</p><p>⑤ 图集 / 其他制品可逐张标记草稿、上色、细化进度；所有工序均可增删、调整顺序。运输若为下印流程最后一环，会单独倒推最晚寄出日，并与红色收货 DDL 分开。</p><p>⑥ 每个节点默认提前 7 天提醒，可调整天数和颜色；提醒目前只在日历显示，不会发送通知。数据仅保存在浏览器本机，建议定期导出备份。</p></div>`,`<button class="btn primary" data-action="close-modal">知道了</button>`)}
function renderModal(){const root=document.getElementById('modal-root');if(!ui.modal){root.innerHTML='';return}root.innerHTML=ui.modal==='event'?eventModal():ui.modal==='product'?productModal():ui.modal==='track'?trackModal():ui.modal==='step'?stepModal():ui.modal==='log'?logModal():ui.modal==='backup'?backupModal():ui.modal==='help'?helpModal():ui.modal==='reminder'?reminderModal():ui.modal==='node'?nodeModal():''}
function readForm(id){const form=document.getElementById(id);if(!form||!form.reportValidity())return null;return Object.fromEntries(new FormData(form).entries())}



function saveStepModal(){const values=readForm('step-form');if(!values)return;const ctx=ui.context||{},ref=ctx.stepId?stepBy(ctx.stepId):null,p=ref?.p||productBy(ctx.productId);if(!p)return;const targetList=ref?(ref.shared?p.shared:ref.t.steps):(ctx.trackId==='shared'?p.shared:p.tracks.find(t=>t.id===ctx.trackId)?.steps);if(!targetList)return;const kind=values.kind||'fixed';if(ctx.trackId==='shared'&&kind==='quantity'){notify('下印环节暂不支持数量型，请添加到独立工作路线');return}const s=ref?.s||mkStep(values.name,kind);s.name=values.name.trim();s.kind=kind;s.remindDays=Math.max(0,Math.floor(nval(values.remindDays,7)));s.nodeColor=values.nodeColor||'blue';s.remindColor=values.remindColor||'yellow';s.isMine=!!values.isMine;if(!s.name){notify('请输入环节名称');return}if(kind==='quantity'){
 s.plannedDays=values.plannedDays===''?null:Math.max(1,Math.ceil(nval(values.plannedDays,1)));
 s.unit=(values.unit||'P').trim();s.total=Math.max(0,nval(values.total));s.done=Math.max(0,nval(values.done));const base=s.unit==='字'?1000:1;s.unitMinutes=values.rate===''?null:Math.max(0,nval(values.rate))*60/base; if(!ref)s.completed=false;
 if(s.pieceStage){s.total=p.pieces?.length||0;s.done=0;s.unit='张'}
}else{s.days=Math.max(1,Math.round(nval(values.days,1)));s.completed=!!values.completed;s.pieceStage=null}
 if(!ref)targetList.push(s);persist();closeModal();render();notify('工序已保存，日期已重新计算')}
function addExample(){if(data.events.length||data.products.length){if(!confirm('载入演示案例将清空当前数据，确定继续吗？'))return}const e={id:uuid(),name:'春日同人 ONLY（演示）',mode:'official',ddl:addDay(todayISO(),45)};const novel=mkTemplate('novel',42000),comic=mkTemplate('comic',24);novel.tracks[0].steps.find(s=>s.kind==='quantity').done=12000;comic.tracks[0].steps.find(s=>s.name==='分镜').done=8;data={baselines:{},events:[e],products:[{id:uuid(),type:'novel',title:'《星光》小说本',eventId:e.id,...novel},{id:uuid(),type:'comic',title:'《雨天》漫本',eventId:e.id,...comic}],logs:[]};ui.view='calendar';ui.month=parseDay(todayISO());ui.selectedDate=todayISO();persist();closeModal();render();notify('已载入演示案例（可以随时清空）')}
function exportData(){const blob=new Blob([JSON.stringify({format:'zhishang-fandom-ddl-v1',savedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`纸上赶稿_备份_${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('数据备份已下载')}
function handleAction(node){const action=node.dataset.action,ids=node.dataset;
 if(action==='overlay'){closeModal();return}
 if(action==='close-modal'){closeModal();return}
 if(action==='view'){ui.view=ids.view;render();return}
 if(action==='detail'){ui.selectedProduct=ids.product;ui.view='detail';render();return}
 if(action==='month-prev'||action==='month-next'){const direction=action==='month-prev'?-1:1;if(window.innerWidth<=860&&ui.mobileMode==='week'){ui.selectedDate=addDay(ui.selectedDate,7*direction);ui.month=parseDay(ui.selectedDate)}else{ui.month=new Date(ui.month.getFullYear(),ui.month.getMonth()+direction,1,12);ui.selectedDate=dateISO(ui.month)}render();return}
 if(action==='today'){ui.month=parseDay(todayISO());ui.selectedDate=todayISO();render();return}
 if(action==='calendar-mode'){ui.calendarMode=ids.mode;render();return}
 if(action==='toggle-mobile-mode'){ui.mobileMode=ui.mobileMode==='week'?'month':'week';render();return}
 if(action==='select-day'){ui.selectedDate=ids.day;render();return}
 if(action==='new-event'){openModal('event');return}
 if(action==='edit-event'){openModal('event',{id:ids.event});return}
 if(action==='save-event'){
 const v=readForm('event-form');if(!v)return;if(!v.name.trim())return notify('活动名称不能为空');const edit=ui.context?.id?eventBy(ui.context.id):null;const isFirst=data.events.length===0;
 if(edit)Object.assign(edit,{name:v.name.trim(),mode:v.mode,ddl:v.ddl});else data.events.push({id:uuid(),name:v.name.trim(),mode:v.mode||'official',ddl:v.ddl});persist();closeModal();render();notify(edit?'活动已更新':'活动已创建');if(isFirst&&data.products.length===0)openModal('product',{draft:{type:'novel',count:60000,eventId:data.events[0].id}});return}
 if(action==='delete-event'){const e=eventBy(ids.event);if(!e)return;const used=data.products.filter(p=>p.eventId===e.id).length;if(used){notify('此活动已有制品关联。请先调整制品关联，再删除活动。');return}if(!confirm(`删除活动「${e.name}」？`))return;data.events=data.events.filter(x=>x.id!==e.id);persist();render();return}
 if(action==='new-product'){if(!data.events.length){openModal('event');notify('先创建一个参展活动');return}openModal('product',{draft:{type:'novel',count:60000,eventId:data.events[0].id}});return}
 if(action==='edit-product'){openModal('product',{id:ids.product});return}
 if(action==='choose-type'){const f=document.getElementById('product-form');const d=ui.context.draft;d.title=f?.elements.title.value||'';d.eventId=f?.elements.eventId.value||data.events[0]?.id;d.type=ids.type;d.count={novel:60000,comic:32,anthology:1,artbook:8,goods:1}[ids.type];renderModal();return}
 if(action==='save-product'){const v=readForm('product-form');if(!v)return;const edit=ui.context?.id?productBy(ui.context.id):null;const type=ui.context?.draft?.type||edit?.type||'novel';if(edit){edit.title=v.title.trim();edit.eventId=v.eventId;ui.selectedProduct=edit.id}else{const built=mkTemplate(type,Math.max(1,nval(v.count,8)));const p={id:uuid(),type,title:v.title.trim(),eventId:v.eventId,...built};data.products.push(p);ui.selectedProduct=p.id}persist();closeModal();ui.view='detail';render();notify(edit?'制品已更新':'制品已创建，可继续修改流程');return}
 if(action==='delete-product'){const p=productBy(ids.product);if(!p||!confirm(`删除「${p.title}」及其所有赶稿记录？此操作不可撤销。`))return;const stepIds=[...p.tracks.flatMap(t=>t.steps),...p.shared].map(s=>s.id);data.logs=data.logs.filter(l=>!stepIds.includes(l.stepId));data.products=data.products.filter(x=>x.id!==p.id);ui.view='products';persist();render();return}
 if(action==='toggle-track'){ui.expandedTracks.has(ids.track)?ui.expandedTracks.delete(ids.track):ui.expandedTracks.add(ids.track);render();return}
 if(action==='toggle-manage-track'){ui.manageTracks.has(ids.track)?ui.manageTracks.delete(ids.track):ui.manageTracks.add(ids.track);render();return}
 if(action==='toggle-production-manage'){ui.manageProduction=!ui.manageProduction;render();return}
 if(action==='toggle-pieces'){ui.showPieces=!ui.showPieces;render();return}
 if(action==='add-track'){openModal('track',{productId:ids.product});return}
 if(action==='edit-track'){openModal('track',{productId:ids.product,trackId:ids.track});return}
 if(action==='save-track'){const v=readForm('track-form');if(!v)return;const p=productBy(ui.context.productId),t=p?.tracks.find(x=>x.id===ui.context.trackId);if(!p)return;if(t){if(p.type==='anthology'){t.category=t.category||(t.steps.some(s=>['草稿','上色','细化'].includes(s.name))?'illustration':'text')}if(p.type==='anthology'&&v.template!==t.category){if(!confirm('改变内容类型会重置这位参与者的制作阶段及原有进度，是否继续？'))return;const ids=t.steps.map(x=>x.id);data.logs=data.logs.filter(l=>!ids.includes(l.stepId));t.steps=participantSteps(v.template);t.category=v.template;}t.owner=(v.owner||'主催').trim();t.isMine=!!v.isMine;t.name=p.type==='anthology'?`${t.category==='illustration'?'绘图内容':'文本内容'}-${t.owner}`:v.name.trim()}else{const preset=v.template||'custom';const name=p.type==='anthology'?`${preset==='illustration'?'绘图内容':'文本内容'}-${(v.owner||'作者A').trim()}`:v.name.trim();const steps=participantSteps(preset);const track=mkTrack(name,(v.owner||'主催').trim(),steps);track.isMine=!!v.isMine;if(p.type==='anthology')track.category=preset;p.tracks.push(track)}persist();closeModal();render();return}
 if(action==='delete-track'){const p=productBy(ui.context.productId),t=p?.tracks.find(x=>x.id===ui.context.trackId);if(!p||!t||!confirm(`删除路线「${t.name}」及其相关记录？`))return;const ss=t.steps.map(s=>s.id);data.logs=data.logs.filter(l=>!ss.includes(l.stepId));p.tracks=p.tracks.filter(x=>x.id!==t.id);persist();closeModal();render();return}
 if(action==='add-step'){openModal('step',{productId:ids.product,trackId:ids.track});return}
 if(action==='edit-step'){const ref=stepBy(ids.step);if(!ref)return;openModal('step',{stepId:ids.step,productId:ref.p.id,trackId:ref.shared?'shared':ref.t.id});return}
 if(action==='save-step'){saveStepModal();return}
 if(action==='delete-step'){const ref=stepBy(ids.step);if(!ref||!confirm(`删除工序「${ref.s.name}」及其赶稿记录？`))return;if(ref.shared)ref.p.shared=ref.p.shared.filter(s=>s.id!==ref.s.id);else ref.t.steps=ref.t.steps.filter(s=>s.id!==ref.s.id);data.logs=data.logs.filter(l=>l.stepId!==ref.s.id);persist();render();return}
 if(action==='move-step'){const p=productBy(ids.product);if(!p)return;const arr=ids.track==='shared'?p.shared:p.tracks.find(t=>t.id===ids.track)?.steps;if(!arr)return;const i=arr.findIndex(x=>x.id===ids.step),j=i+nval(ids.dir);if(i>=0&&j>=0&&j<arr.length){[arr[i],arr[j]]=[arr[j],arr[i]];persist();render()}return}
 if(action==='toggle-step'){const ref=stepBy(ids.step);if(!ref)return;if(doneStep(ref.p,ref.s)&&ref.s.kind==='quantity'&&stepDone(ref.p,ref.s)>=nval(ref.s.total)){notify('该环节已达到目标数量；如需恢复，请先调整目标数量或完成量');return}ref.s.completed=!ref.s.completed;ref.s.completedAt=ref.s.completed?todayISO():null;persist();closeModal();render();notify(ref.s.completed?'已标记完成':'已恢复');return}
 if(action==='add-piece'){const p=productBy(ids.product);if(!p)return;const name=prompt('新画稿名称：',`插画 ${String(p.pieces.length+1).padStart(2,'0')}`);if(name===null||!name.trim())return;p.pieces.push({id:uuid(),name:name.trim(),sketch:false,color:false,refine:false});for(const t of p.tracks)for(const s of t.steps)if(s.pieceStage)s.total=p.pieces.length;persist();render();return}
 if(action==='delete-piece'){const p=productBy(ids.product);if(!p||p.pieces.length<=1){notify('至少保留一张画稿');return}if(!confirm('删除这张画稿及其阶段记录？'))return;p.pieces=p.pieces.filter(x=>x.id!==ids.piece);for(const t of p.tracks)for(const s of t.steps)if(s.pieceStage)s.total=p.pieces.length;persist();render();return}
 if(action==='toggle-piece'){const p=productBy(ids.product),piece=p?.pieces.find(x=>x.id===ids.piece);if(!piece)return;piece[ids.phase]=!piece[ids.phase];persist();render();return}
 if(action==='open-node'){openModal('node',{stepId:ids.step});return}
 if(action==='calendar-entry'){if(ids.kind==='deadline'){ui.selectedProduct=ids.product;ui.view='detail';render()}else if(ids.kind==='node'||ids.kind==='reminder'){openModal('node',{stepId:ids.step})}else openModal('log',{stepId:ids.step,date:ids.day});return}
 if(action==='reminder'){openModal('reminder',{stepId:ids.step});return}
 if(action==='save-node'){
   const values=readForm('node-form');if(!values)return;
   const ref=stepBy(ui.context?.stepId);if(!ref)return;
   const st=ref.s,ship=isShippingStep(st);
   if(!ship){st.promisedDelivery=values.promisedDelivery||null;st.dueBy=values.dueBy||null;}
   if(ship){ref.p.actualDispatch=values.actualFinished||null;}else st.completedAt=values.actualFinished||null;
   st.completed=!!values.completed;
   // A date by itself is a recorded fact only after confirming the milestone.
   if(st.completed&&!ship&&st.completedAt===null)notify('节点已完成，但实际日期未知：后续预测会标记不确定');
   if(ship)st.completedAt=st.completed?values.actualFinished||null:null;
   if(!st.completed){st.completedAt=null;if(ship)ref.p.actualDispatch=null;}
   persist();closeModal();render();return;
 }
 if(action==='confirm-baseline'){
   const p=productBy(ids.product),e=eventBy(p?.eventId);if(!p||!e)return;
   if(data.baselines[p.id]&&!confirm('重新确认会覆盖该制品的原计划基线。确定更新吗？'))return;
   try{data.baselines[p.id]=FandomP0Bridge.baselineFor(p,e,data.logs,todayISO());persist();render();notify('原计划基线已保存');}
   catch(err){notify('无法确认原计划：'+err.message)}return;
 }
 if(action==='save-reminder'){const v=readForm('reminder-form');if(!v)return;const ref=stepBy(ui.context?.stepId);if(!ref)return;ref.s.remindDays=Math.max(0,Math.floor(nval(v.days,7)));ref.s.nodeColor=v.nodeColor||'blue';ref.s.remindColor=v.remindColor||'yellow';persist();closeModal();render();notify('提前提醒已更新');return}
 if(action==='task'){if(!ids.step){ui.selectedProduct=ids.product;ui.view='detail';render();return}openModal('log',{stepId:ids.step,date:ids.day||todayISO()});return}
 if(action==='save-log'){const v=readForm('log-form');if(!v)return;const ref=stepBy(ui.context.stepId);if(!ref)return;const hours=v.hours===''?0:Math.max(0,nval(v.hours));if(hours>1000)return notify('请核对今日用时');const minutes=hours*60;let amount=ref.s.kind==='quantity'?Math.max(0,nval(v.amount)):0;let pieceIds=[];if(ref.s.pieceStage){const avail=ref.p.pieces.filter(p=>!p[ref.s.pieceStage]);const k=Math.min(avail.length,Math.floor(amount));pieceIds=avail.slice(0,k).map(p=>p.id);for(const piece of avail.slice(0,k))piece[ref.s.pieceStage]=true;if(amount>k)notify('超出剩余画稿数量，已按实际可完成数量记录');amount=k}const completedByLog=!!v.complete&&!ref.s.completed;if(v.complete){ref.s.completed=true;ref.s.completedAt=v.date||todayISO();}const log={id:uuid(),date:v.date||todayISO(),productId:ref.p.id,trackId:ref.t?.id||null,stepId:ref.s.id,minutes,amount,note:(v.progressText||'').trim(),pieceIds,completedByLog,createdAt:Date.now()};data.logs.push(log);persist();ui.month=parseDay(log.date);ui.selectedDate=log.date;ui.view='calendar';closeModal();render();notify('进度已保存，日历已更新');return}
 if(action==='delete-log'){const log=data.logs.find(l=>l.id===ids.log);if(!log||!confirm('删除这条赶稿记录？'))return;const ref=stepBy(log.stepId);if(ref?.s.pieceStage)for(const id of log.pieceIds||[]){const piece=ref.p.pieces.find(x=>x.id===id);if(piece)piece[ref.s.pieceStage]=false}data.logs=data.logs.filter(x=>x.id!==log.id);if(log.completedByLog&&ref&&!data.logs.some(x=>x.stepId===log.stepId&&x.completedByLog)){ref.s.completed=false;ref.s.completedAt=null;}persist();render();return}
 if(action==='backup'){openModal('backup');return}
 if(action==='help'){openModal('help');return}
 if(action==='export'){exportData();return}
 if(action==='clear-data'){if(!confirm('清空所有活动、制品和赶稿记录？该操作不可恢复（除非已有备份）。'))return;data={events:[],products:[],logs:[],baselines:{}};persist();closeModal();ui.view='calendar';render();return}
 if(action==='sample'){addExample();return}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='overlay'&&e.target!==el)return;e.stopPropagation();handleAction(el)});
document.addEventListener('change',async e=>{if(e.target.id==='step-kind'){const kind=e.target.value;document.getElementById('qty-fields').classList.toggle('hide',kind!=='quantity');document.getElementById('duration-fields').classList.toggle('hide',kind==='quantity')}
 if(e.target.id==='import-file'&&e.target.files?.[0]){try{const file=e.target.files[0];const raw=JSON.parse(await file.text());const d=raw.data||raw;if(!Array.isArray(d.events)||!Array.isArray(d.products)||!Array.isArray(d.logs))throw new Error('文件格式不正确');if(!confirm('确定用此备份替换全部当前数据吗？'))return;data={events:d.events,products:d.products,logs:d.logs,baselines:d.baselines||{}};normalizeData();persist();closeModal();ui.view='calendar';ui.month=parseDay(todayISO());ui.selectedDate=todayISO();render();notify('数据已恢复')}catch(ex){alert('无法导入备份：'+ex.message)}}});
render();
if(!data.events.length&&!data.products.length)setTimeout(()=>openModal('event'),200);
</script>
