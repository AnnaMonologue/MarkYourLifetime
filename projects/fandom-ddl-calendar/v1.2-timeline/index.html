.production-chain{display:flex;flex-direction:column;gap:7px;padding:13px}.chain-unit{display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%;padding:12px 14px}.chain-unit .label{min-width:110px}.chain-unit .date{margin-top:0;flex:1}.chain-unit .tools{margin-top:0}.chain-unit .tools button{padding:5px 2px}
.focus-item.finished-focus,.week-item.completed{background:#f5f6f3;border-color:#e9ece8;opacity:.74}
/* v0.2: restrained selection controls, compact content lanes, muted completed work */
.delivery-select{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:5px}
.delivery-option{display:block;position:relative;cursor:pointer}
.delivery-option input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.delivery-option span{display:block;padding:13px 14px;text-align:center;border:1px solid var(--line);border-radius:10px;background:#fff;color:#53635c;font-size:13px;font-weight:650;transition:background .15s,border-color .15s}
.delivery-option input:checked+span{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.delivery-option input:focus-visible+span{outline:3px solid #a4c9be;outline-offset:2px}
.type-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:8px 0}
.type-card{min-height:46px;padding:10px 4px;display:grid;place-items:center;text-align:center;font-weight:650;font-size:13px;border-radius:9px;line-height:1.35}
.type-card.selected{background:var(--accent-soft);border-color:var(--accent)}
.track-head{align-items:center}
.step-link{appearance:none;border:0;background:transparent;padding:0;text-align:left;color:var(--ink);font-size:13px;font-weight:750;cursor:pointer}
.step-link:hover{color:var(--accent);text-decoration:underline}
.step-item.is-finished,.chain-unit.is-finished{background:#f4f5f3;color:#89928e}
.step-item.is-finished{border-radius:9px;padding:11px 8px;margin:4px -8px 0;opacity:.7}
.step-item.is-finished .step-link,.chain-unit.is-finished .step-link{color:#8b948e}
.step-item.is-finished .bar-inner{background:#bbc3be}
.chain-unit.is-finished{order:99;opacity:.72}
.chain-unit.is-finished+.arrow{opacity:.25}
.muted-pill{color:#737c77;background:#e7eae7;margin-left:5px}
.mark-done{margin-top:15px;border-top:1px solid var(--line);padding-top:15px;display:grid;gap:5px}
.done-check{display:flex;gap:10px;align-items:center;font-weight:650;font-size:13px;cursor:pointer}
.done-check input{accent-color:var(--accent);width:18px;height:18px}
.mark-done small{font-size:11px;padding-left:28px}
@media(max-width:540px){.type-grid{gap:4px}.type-card{font-size:12px;padding:9px 2px;min-height:44px}}

.pane{border-top:1px solid rgba(57,78,83,.55)}
.pane-heading{border-bottom-color:#dbe0dc;background:rgba(247,248,245,.7)}
.pane-title{font-family:var(--serif);font-weight:650;letter-spacing:.4px;color:#25373b}
.metric .num,.metric .label{font-variant-numeric:tabular-nums}
.metric .num{font-family:var(--serif);color:#2f4246}
.metric.warn{background:#faf6f3;border-color:#e4d7d1}

.detail-hero{border-top:1px solid rgba(54,72,77,.55)}
.detail-hero h2,.item-title,.track-name,.section-head h2{font-family:var(--serif);font-weight:650;letter-spacing:.3px}
.track-card{border-left:1px solid rgba(138,155,155,.68)}
.bar{background:#e3e8e5;border-radius:1px;height:5px}
.bar-inner,.today-bar>span{background:#536e68;border-radius:0}
.pill{background:#eff1ee;color:#62716f;border-radius:2px}
.pill.green{background:#e9eeeb;color:#416a5d}
.pill.orange{background:#f6f0e7;color:#886c43}
/* Calendar: ruled paper + precise red seal for today */
.unified-calendar .calendar-toolbar{background:var(--panel);padding:22px 22px 18px}
.cal-month{font-family:var(--serif);font-weight:650;font-size:21px;color:#203035;letter-spacing:.65px}
.calendar-filter,.mode-tabs,.calendar-view-picker{background:#edeFEB;border:1px solid #dce1dd;border-radius:999px;padding:4px;gap:2px;box-shadow:0 10px 22px rgba(24,37,39,.04), inset 0 1px 0 rgba(255,255,255,.65)}
.calendar-filter button,.mode-tab,.calendar-view-picker button{border-radius:999px;color:#687676;font-size:12px;letter-spacing:.2px}
.calendar-filter button[aria-pressed="true"],.mode-tab.active,.calendar-view-picker button[aria-pressed="true"]{background:#34464b;color:#fff;box-shadow:none}
.calendar-filter button:hover:not([aria-pressed="true"]){background:#dfe5e1}
.cal-hint{border-top:1px solid #e0e4e1;background:#f9faf8;color:#6f7b79}
.legend-dot{border-radius:0;width:7px;height:7px}
.weekdays{background:#f0f3f0}
.weekdays div{font-family:var(--serif);color:#576769;padding:13px 3px;letter-spacing:.4px}
.calendar-grid{background:#dce2de;gap:1px;border-top:1px solid #d8deda}
.calendar-grid .day{border:0;background:linear-gradient(180deg,#fcfcfa 0%,#f7f8f5 100%);min-height:142px;border-radius:12px}
.calendar-grid .day.faded{background:#f5f6f3}
.calendar-grid .day.today{background:#f7f9f6}
.calendar-grid .day.selected{outline:1px solid rgba(122,147,144,.85);outline-offset:-1px;box-shadow:0 0 0 3px rgba(148,169,167,.16),0 16px 30px rgba(28,40,43,.06)}
.unified-calendar .clean-day{height:147px;padding:7px 6px}
.day-date{color:#8b9898;margin-bottom:8px}
.day-date strong{font-family:var(--serif);font-size:12px;font-weight:650;width:27px;height:27px;color:#2a3538}
.day.today .day-date strong{background:#a04440;color:#fffaf3;border-radius:8px;transform:rotate(-2deg);box-shadow:0 8px 18px rgba(160,68,64,.18)}
.unified-calendar .day-date-link:hover strong{background:#e6ebe8;color:#293f43;border-radius:2px}
.day-count{color:#859294;font-size:10px}
.calendar-chip{font-family:var(--sans);border-left-width:2px;border-radius:8px!important;font-weight:600;font-size:10px;padding:6px 7px;line-height:1.34;box-shadow:0 10px 18px rgba(27,39,41,.04), inset 0 1px 0 rgba(255,255,255,.55)}
.calendar-chip:hover,.focus-entry:hover,.week-item:hover{filter:brightness(.96)}
.day-entries{gap:4px}
.tone-red{background:var(--ddl-bg)!important;color:#963b36!important;border-color:var(--ddl)!important}
.tone-blue{background:var(--node-bg)!important;color:#3e6273!important;border-color:var(--node)!important}
.tone-yellow{background:var(--remind-bg)!important;color:#806137!important;border-color:var(--remind)!important}
.tone-green{background:var(--personal-bg)!important;color:#42665b!important;border-color:var(--personal)!important}
.tone-purple{background:#f3f0f6!important;color:#75617d!important;border-color:#786b86!important}
.tone-orange{background:#f7f0e9!important;color:#906344!important;border-color:#a87950!important}
.tone-gray{background:#f0f2f0!important;color:#626e70!important;border-color:#77878a!important}
.more-entries{padding:5px 6px;color:#5f7175;font-weight:650}
.week-item,.focus-entry{border-radius:10px!important}
.week-day{border-color:#dce1dd}
.week-day-head{font-family:var(--serif)}
.week-date.today{color:#923b36}
.week-item{background:#f7f9f7;border-color:#dce3e0}
.week-item .primary-label{color:#39575d}
/* Daily progress */
.progress-header{border-bottom:1px solid #d1d9d5;padding-bottom:17px;margin-bottom:19px}
.progress-header h2{font-family:var(--serif);font-size:25px;letter-spacing:1px;font-weight:650}
.progress-date-controls input{background:#fafbf9;border-color:#cbd4d0;border-radius:2px}
.progress-summary{border-left:1px solid rgba(110,136,137,.75);background:#f9faf8;gap:19px}
.progress-summary strong{font-family:var(--serif);color:#26383d;font-weight:650}
.today-task{padding:17px;border-left:1px solid rgba(165,185,179,.8)}
.today-task h3{font-family:var(--serif);font-weight:650;letter-spacing:.15px;color:#203439}
.today-task.completed-work{background:#f4f5f1}
.status-todo,.status-done{border-radius:2px;background:#edf1ee;color:#436258}
.status-done{background:#edf0ed;color:#737d7a}
.today-task-plan strong{color:#2c4246}
.today-bar{border-radius:0;background:#e0e6e2;height:5px}
.today-task.overdue-work{background:#fbf5f2;border-color:#bf8a83}
.overdue-note{color:#994640}
.attention-dot,.upcoming-mark{border-radius:1px}
.upcoming-row,.event-product{background:transparent;color:#42575b}
.upcoming-row:hover,.event-product:hover{background:#eff2ef}
.event-product{border-radius:0}
.alert{background:#faf5f0;border:1px solid #e5d4cc;border-left:2px solid #a24540;color:#8d554b;border-radius:2px}
.inbox-state{background:#f6f1e8;border-radius:2px;color:#846a40}
.inbox-state.urgent{background:#faeeec;color:#9b4841}
/* Forms / small controls / dialogs */
.type-card{background:#fafbf8;min-height:47px;border-radius:12px}
.type-card.selected{background:#e9edeb;border-color:#546c72;color:#263e44}
.delivery-option span{background:#fafbf9;border-color:#cfd8d3;color:#586969;border-radius:12px}
.delivery-option input:checked+span{background:#e9eeeb;border-color:#526971;color:#2e4449}
.field label{color:#3a5055}
.field input,.field select,.field textarea{border-color:#cfd7d3;background:#fffefa;border-radius:10px;color:#293d41;box-shadow:inset 0 1px 0 rgba(255,255,255,.68), 0 8px 18px rgba(27,39,41,.025)}
.field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 2px #e6edeb;border-color:#627c80}
.step-link:hover{color:#344f54}
.step-item.is-finished,.chain-unit.is-finished{background:#f0f2ee;color:#798584;border-radius:10px}
.piece-chip{border-radius:2px;color:#647571}
.piece-chip.active{color:#385c57;border-color:#95aea6;background:#e9f0ec}
.reminder-pill,.muted-pill{border-radius:2px}
.modal-layer{background:rgba(24,33,35,.38);backdrop-filter:blur(2px)}
.modal{background:linear-gradient(180deg,#fcfcf9 0%,#f5f6f2 100%);border:1px solid rgba(133,147,144,.42);border-radius:16px;box-shadow:0 26px 75px rgba(18,31,34,.22)}
.modal-top{border-bottom:1px solid #e2e6e2;background:#f8f9f6;padding:22px 25px 16px;position:relative}
.modal-top:before{content:"";position:absolute;left:0;top:20px;bottom:18px;width:3px;background:#9d4541}
.modal-top h2{font-family:var(--serif);font-weight:650;font-size:21px;letter-spacing:.3px}
.modal-foot{background:#f8f9f6}
.xbtn{color:#54676a}
.mark-done{border-top-color:#dce2df}
.done-check input{accent-color:#48675f}
.toast{border-radius:2px;background:#29393d;color:#fafbf7;box-shadow:var(--shadow)}

.calendar-chip,.step-details,.attention-body small,.day-task,.recent-entry,.upcoming-row{letter-spacing:.05px}
.slim-track-header,.slim-step,.inbox-row{border-color:#dce2df}
.slim-track-header:hover,.slim-step:hover{background:#f6f8f5}
/* Diffused ink-edge accents */
.sidebar,.secondary-nav,.main,.topbar,.calendar-toolbar,.progress-header{position:relative}
.sidebar::after,.secondary-nav::after,.topbar::before{content:"";position:absolute;pointer-events:none;left:8px;right:8px;height:18px;bottom:-9px;background:radial-gradient(ellipse at center, rgba(58,73,76,.12) 0%, rgba(58,73,76,.06) 30%, transparent 72%);filter:blur(8px);opacity:.45}
.topbar::before{left:0;right:auto;bottom:auto;top:-12px;width:110px;height:26px;background:radial-gradient(ellipse at center, rgba(154,74,68,.16) 0%, rgba(154,74,68,.06) 34%, transparent 75%);opacity:.3}
.nav-button:hover,.secondary-item:hover,.btn:hover,.iconbtn:hover{box-shadow:0 12px 24px rgba(24,37,39,.06)}
.calendar-grid .day.faded::before{opacity:.24}
.calendar-grid .day.today::before{opacity:.5;background:radial-gradient(circle at 0 0, rgba(157,69,65,.10), transparent 34%),radial-gradient(circle at 100% 100%, rgba(68,94,90,.10), transparent 34%)}

 .main{padding-top:24px}

}
@media (max-width:860px){

 .cal-month{font-size:19px}
 .calendar-filter{display:flex}
 .calendar-filter button{min-height:37px}
 .calendar-view-picker{background:#e9eeea}

 *,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

/* softer controls but still readable and clickable */
.btn,.iconbtn,.type-card,.delivery-option span,.secondary-title button,.field input,.field select,.field textarea {
 border-radius:8px 5px 9px 5px;
}
.btn,.iconbtn {box-shadow:0 3px 10px rgba(42,62,62,.035);}
.btn.primary {background:linear-gradient(130deg,#3a5051 0%,#34484b 48%,#283b3e 100%);}
.btn.primary:hover {background:#2d4144;}
.calendar-filter,.mode-tabs,.calendar-view-picker {background:#e9eee8;border-color:rgba(85,104,100,.11);border-radius:100px;}
.calendar-filter button,.mode-tab,.calendar-view-picker button {border-radius:100px;}

.calendar-grid .day {border:1px solid rgba(77,99,95,.085);border-radius:7px 4px 8px 5px;
 background:linear-gradient(160deg,rgba(252,253,248,.96),rgba(247,249,244,.96));
 box-shadow:0 5px 14px rgba(38,62,59,.023);isolation:isolate;}
.calendar-grid .day.faded{background:linear-gradient(160deg,rgba(240,243,237,.85),rgba(242,244,238,.82));}
.calendar-grid .day.today {background:linear-gradient(160deg,#fbfcf6,#f3f8f0);}
.calendar-grid .day.selected {outline:1px solid rgba(97,130,117,.32);box-shadow:0 0 0 2px rgba(122,144,137,.09);}
.day.today .day-date strong {border-radius:2px 5px 3px 3px;background:#a3483f;}
.unified-calendar .clean-day {padding:7px 6px;}
.weekdays,.cal-hint {background:rgba(238,242,235,.78);}
.weekdays div{font-family:var(--serif);}

.today-bar,.bar{border-radius:8px;height:5px;background:#e5eae3;}
.today-bar>span,.bar-inner{border-radius:8px;background:#617e74;}
.alert{border:1px solid rgba(171,118,105,.2);border-radius:8px 4px 9px 5px;}
.modal{border-radius:10px 5px 11px 5px;box-shadow:0 25px 65px rgba(28,44,45,.17);}

@media(max-width:860px){.calendar-grid{gap:3px;padding:4px}.calendar-grid .day{min-width:0}}
@media(max-width:520px){.calendar-grid{gap:2px;padding:2px}.unified-calendar .clean-day{padding:4px 3px}}

/* v1.1 desktop workspaces, global unit-time settings and comfortable ink manuscript layout */
.product-tabs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:17px 0 20px;padding:7px 0 12px;border-bottom:1px solid rgba(76,86,88,.16)}
.product-tabs button{font-family:var(--serif);font-size:14px;color:#576b6e;background:rgba(249,250,247,.65);border:1px solid rgba(122,142,142,.2);border-radius:8px;padding:10px 18px;cursor:pointer;transition:background .15s}
.product-tabs button.active{background:#374b4c;color:white;border-color:#374b4c}
.product-tabs button:hover:not(.active){background:#ecf1ed}
.product-overview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.overview-tile{width:100%;min-height:145px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:24px;text-align:left;cursor:pointer;color:#394f53}
.overview-tile strong{font:600 20px var(--serif);color:#1c3337}
.overview-tile span:not(.tile-index){font-size:12px;color:#6e7d7b}
.overview-tile em{font-size:12px;font-style:normal;color:#8c5a50;margin-top:auto}
.tile-index{font:600 11px var(--sans);letter-spacing:1px;color:#937369}
.desktop-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:16px}
.desktop-columns .track-card{min-width:0;margin:0}
.global-rate-tip{display:flex;align-items:center;gap:12px;background:rgba(242,245,240,.85);padding:11px 13px;color:#667877;border-radius:8px;font-size:12px}
.settings-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,1fr);align-items:start;gap:20px}
.settings-pane,.settings-note{min-width:0}
.rates-grid{padding:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.rate-field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:#354d51}
.rate-input-line{display:flex;align-items:center;gap:10px}
.rate-input-line input{width:100%;max-width:180px;padding:11px;border:1px solid #c9d4d0;border-radius:8px;background:#fdfcf9;font:500 14px var(--sans);color:#2c4449}
.rate-input-line small{font-weight:400;color:#71807d}
.settings-foot{padding:0 18px 20px;display:flex;justify-content:flex-end}
.settings-help{padding:21px;display:grid;gap:17px;color:#617375;line-height:1.8;font-size:13px}
.copy-summary{margin:5px 0 13px;padding:11px 13px;background:#eff3ef;border-radius:8px;color:#4e6165;font-size:12px}
@media(max-width:1180px){.desktop-columns,.settings-layout{grid-template-columns:1fr}}
@media(max-width:860px){.product-overview-grid,.rates-grid{grid-template-columns:1fr}.product-tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;position:relative}.product-tabs button{white-space:nowrap;flex:0 0 auto;padding:10px 13px}.overview-tile{min-height:128px}.settings-help{padding:15px}}

/* v1.2 - horizontal editorial timeline: manuscript -> production -> transit */
.manuscript-timeline{padding:24px 26px 19px;overflow:visible}
.timeline-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:28px}
.timeline-heading h3{font:600 25px var(--serif);margin:5px 0 0;color:#273b3c;letter-spacing:1px}
.timeline-note,.timeline-disclaimer{font-size:11px;line-height:1.8;color:#73807e}
.timeline-track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative}
.timeline-stage{min-width:0;position:relative;color:#394d51;display:flex;flex-direction:column}
.timeline-bar{height:14px;position:relative;display:flex;align-items:center;gap:12px;border-radius:13px;color:#536d71;font-size:10px;font-weight:750;letter-spacing:1px;margin:0 4px 18px 0;padding:1px 0 0 17px}
.timeline-stage:not(:last-child) .timeline-bar:after{content:"";position:absolute;left:100%;top:6px;width:16px;height:2px;background:rgba(80,101,103,.35)}
.timeline-node{position:absolute;left:0;top:2px;width:11px;height:11px;border-radius:50%;border:3px solid currentColor;background:#fbfcf8;box-shadow:0 0 0 3px rgba(90,115,115,.1)}
.timeline-manuscript .timeline-bar{color:#54746d;background:linear-gradient(90deg,rgba(76,115,107,.16),rgba(76,115,107,.03))}
.timeline-factory .timeline-bar{color:#617687;background:linear-gradient(90deg,rgba(85,113,134,.17),rgba(85,113,134,.04))}
.timeline-shipping .timeline-bar{color:#ab6757;background:linear-gradient(90deg,rgba(157,88,70,.17),rgba(157,88,70,.04))}
.timeline-stage-inner{flex:1;border:1px solid rgba(110,132,130,.25);border-top:2px solid currentColor;border-radius:8px;padding:19px 17px 14px;background:linear-gradient(180deg,rgba(251,252,249,.83),rgba(245,247,243,.5));display:flex;flex-direction:column}
.timeline-manuscript .timeline-stage-inner{border-top-color:#54746d}
.timeline-factory .timeline-stage-inner{border-top-color:#617687}
.timeline-shipping .timeline-stage-inner{border-top-color:#ab6757}
.timeline-stage h4{font:650 20px var(--serif);letter-spacing:.5px;margin:0 0 8px;color:#253739}
.timeline-start{font-size:11px;color:#7c8987;margin:0 0 17px;line-height:1.5;min-height:14px}
.timeline-end{display:flex;flex-direction:column;gap:4px;margin-bottom:17px}
.timeline-end small{font-size:11px;color:#778684}
.timeline-end strong{font:650 20px var(--serif);font-variant-numeric:tabular-nums;color:#2d4548;word-break:break-word}
.timeline-shipping .timeline-end strong{color:#9a4d43}
.timeline-milestones{border-top:1px solid rgba(107,125,123,.18);margin:0 0 15px;padding:9px 0 0;list-style:none;max-height:178px;overflow-y:auto;scrollbar-width:thin}
.timeline-milestones li{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dotted rgba(120,141,137,.2);font-size:11px;color:#536565}
.timeline-milestones time{flex:0 0 auto;color:#748382;font-variant-numeric:tabular-nums}
.timeline-link{border:0;background:none;color:#667879;text-align:left;margin-top:auto;padding:5px 0;cursor:pointer;font-size:11px;font-weight:650}
.timeline-link:hover{text-decoration:underline}
.timeline-disclaimer{margin:18px 0 0}
.submission-panel{padding:8px 16px 10px}
.submission-intro{font-size:12px;line-height:1.7;color:#728380;padding:9px 0 14px}
.submission-rows{display:grid;gap:7px}
.submission-row{display:flex;align-items:center;gap:14px;border-top:1px solid rgba(116,136,134,.16);padding:12px 2px}
.submission-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.submission-main strong{font:600 15px var(--serif);color:#30464a;overflow-wrap:anywhere}
.submission-main small{font-size:11px;color:#71817e}
.submission-mark{border:1px solid rgba(118,95,126,.55);color:#79657f;border-radius:50%;height:30px;width:30px;flex:0 0 30px;background:transparent;font-size:19px;cursor:pointer}
.submission-row.is-submitted .submission-mark{background:rgba(91,122,103,.13);border-color:#6e937a;color:#486e58}
.submission-row.is-submitted .submission-main{opacity:.64}
.submission-completed{display:flex;align-items:center;margin:20px 0 10px;gap:9px;font-size:13px}
.legend-dot.purple{background:#79657f}
@media(max-width:1100px){.timeline-track{grid-template-columns:1fr;gap:17px}.timeline-stage:not(:last-child) .timeline-bar:after{display:none}.timeline-stage-inner{min-height:0}.timeline-milestones{max-height:150px}.timeline-heading{align-items:flex-start}}
@media(max-width:600px){.manuscript-timeline{padding:16px 15px}.timeline-heading{flex-direction:column;gap:5px;margin-bottom:17px}.timeline-heading h3{font-size:21px}.timeline-stage h4{font-size:18px}.submission-row{gap:8px}}

<script>
/* 纸上赶稿 P0 — Pure scheduling core, browser + Node (CommonJS), 2026-11-15.
   No DOM, no localStorage, no mutation of input. Dates are calendar days, not elapsed hours.
   This is a separately testable module, NOT a drop-in replacement for v0.3.1. */
(function (root, build) {
  const api = build();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) root.FandomSchedulerP0 = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const DAY = 86400000;
  function parseDate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) throw new Error('日期必须是 YYYY-MM-DD: ' + s);
    const t = Date.parse(s + 'T00:00:00.000Z');
    if (!Number.isFinite(t) || new Date(t).toISOString().slice(0, 10) !== s) throw new Error('非法日期: ' + s);
    return t;
  }
  function dateOf(t) { return new Date(t).toISOString().slice(0, 10); }
  function addDate(s, n) { if (!Number.isInteger(n)) throw new Error('日期偏移必须是整数'); return dateOf(parseDate(s) + n * DAY); }
  function daysBetween(a, b) { return (parseDate(b) - parseDate(a)) / DAY; }
  function maxDate(...xs) { return xs.reduce((a, b) => !a || b > a ? b : a, null); }
  function minDate(...xs) { return xs.reduce((a, b) => !a || b < a ? b : a, null); }
  function asDate(value) { return value == null || value === '' ? null : (parseDate(value), value); }
  function nonneg(value, label) { if (!Number.isInteger(value) || value < 0) throw new Error(label + '必须为非负整数'); return value; }

  // Graph convention: each step occupies 1+ full calendar dates, a successor starts the next day.
  // A terminal step must finish by production-ready deadline. Milestones shipping/receipt are separate.
  function plan(req) {
    if (!req || typeof req !== 'object') throw new Error('缺少排程输入');
    const now = asDate(req.today), receipt = asDate(req.receiptDeadline);
    if (!now || !receipt) throw new Error('需要今天和收货 DDL');
    const transit = nonneg(req.transitDays, '运输提前天数');
    const buffer = nonneg(req.handoffBufferDays, '寄出前缓冲天数');
    const latestDispatch = addDate(receipt, -transit);
    const latestProductReady = addDate(latestDispatch, -buffer);
    const steps = req.steps || [];
    if (!Array.isArray(steps)) throw new Error('工序需要数组');
    const byId = new Map(), succ = new Map(), indegree = new Map();
    for (const s of steps) {
      if (!s || typeof s.id !== 'string' || !s.id.trim() || byId.has(s.id)) throw new Error('工序 ID 为空或重复');
      if (!Number.isInteger(s.days) || s.days < 1) throw new Error('工序预计工期至少一天: ' + s.id);
      if (s.predecessors && !Array.isArray(s.predecessors)) throw new Error('前置工序必须是数组');
      for (const k of ['actualFinished', 'promisedDelivery', 'dueBy']) asDate(s[k]);
      byId.set(s.id, s); succ.set(s.id, []); indegree.set(s.id, 0);
    }

  }
 }
 for(const c of allCards()){

function personalTodayRows(day){
 const m=new Map();
 for(const c of allCards()){
  if(c.date!==day||!c.step||!isMineStep(c.track,c.step)||!['quantity','fixed','historical'].includes(c.kind))continue;
  const old=m.get(c.step.id);
  if(!old|| (old.kind==='historical'&&c.kind!=='historical'))m.set(c.step.id,c);
 }
 // A missed latest finish removes daily quotas but must NOT hide unfinished work.
 if(day===todayISO())for(const {p,s} of allSchedules())for(const t of s.tracks)for(const row of t.steps){
  const st=row.step;
  if(!st||doneStep(p,st)||!isMineStep(t.track,st)||!row.end||row.end>=day||m.has(st.id))continue;
  m.set(st.id,{date:day,product:p,step:st,track:t.track,kind:'overdue',overdue:true,
    due:row.end,forecastFinish:row.forecastFinish,target:'已过原定截止日 · 需重新安排',plan:null});
 }
 return [...m.values()].sort((a,b)=>Number(doneStep(a.product,a.step))-Number(doneStep(b.product,b.step))||a.product.title.localeCompare(b.product.title));
}

function productProgress(p){let sum=0,done=0;for(const s of [...p.tracks.flatMap(t=>t.steps),...p.shared]){sum++;if(doneStep(p,s))done++;else if(s.kind==='quantity'&&nval(s.total)>0)done+=Math.min(1,stepDone(p,s)/s.total)}return sum?Math.round(done/sum*100):0}
function productsPage(){return `<div class="section-head"><h2>全部制品 <span class="badge-count">${data.products.length}</span></h2><button class="btn sm" data-action="new-product">${icon('plus')} 新建制品</button></div>${data.products.length?`<div class="rows">${data.products.map(p=>{const s=scheduleProduct(p),progress=productProgress(p);return `<div class="item-card"><div class="item-header"><div><div class="item-title">${safe(p.title)}</div><div class="item-meta">${TYPE_NAMES[p.type]||'自定义'} · ${safe(s.event?.name||'未关联活动')} · 收货 ${fmtDay(s.deadline)}</div></div><div class="row-end"><span class="pill ${s.risk.length?'orange':'green'}">${s.risk.length?'需核对工期':'排程中'}</span><button class="btn sm" data-action="detail" data-product="${p.id}">查看详情 ${icon('arrow')}</button></div></div><div class="progress-row"><div class="progress-top"><span>创作进度（各环节概览）</span><span>${progress}%</span></div><div class="bar"><div class="bar-inner" style="width:${progress}%"></div></div></div></div>`}).join('')}</div>`:`<div class="pane empty"><strong>还没有制品</strong>从文本本、漫本、合志、图集或其他制品模板中选择一个，系统会预先建立可修改的工序。<br><button class="btn primary" data-action="new-product">创建第一件制品</button></div>`}`}

function productTimeline(p,sched){
 const content=sched.tracks.map(t=>({name:t.track.name,last:t.steps.at(-1)?.end||null,done:t.steps.every(x=>x.complete)}));
 const contentDates=content.map(x=>x.last).filter(Boolean).sort();
 const delivery=contentDates.at(-1)||sched.trackDeadline||null;
 const factory=sched.shared.filter(x=>!x.shipping),shipping=sched.shared.find(x=>x.shipping);
 const factoryStart=factory.map(x=>x.start).filter(Boolean).sort()[0]||null;
 const factoryEnd=factory.map(x=>x.end).filter(Boolean).sort().at(-1)||null;
 const dispatch=shipping?.actualFinished||shipping?.dispatchDate||sched.p0?.plan?.latestDispatch||null;
 const receipt=sched.deadline||null;
 const dd=(value)=>value?safe(value):'待核算';
 const list=(items,kind)=>items.length?items.map(x=>`<li><span>${safe(x.name)}</span><time>${dd(x.date)}</time></li>`).join(''):`<li class="timeline-empty">暂无${safe(kind)}节点</li>`;
 const authorItems=content.map(x=>({name:x.name+(x.done?' · 已完成':''),date:x.last}));
 const factoryItems=factory.map(x=>({name:x.step.name+(x.complete?' · 已完成':''),date:x.end}));
 const stages=[
  {code:'manuscript',caption:'01 / CONTENT',title:'稿件交付',start:'各内容路线',end:dd(delivery),dateHint:'最晚交齐',rows:authorItems,tab:'content'},
  {code:'factory',caption:'02 / PRODUCTION',title:'印厂制作',start:factoryStart?`开始 ${factoryStart}`:'待核算',end:dd(factoryEnd),dateHint:'生产最晚完成',rows:factoryItems,tab:'production'},
  {code:'shipping',caption:'03 / TRANSIT',title:'邮寄计时',start:dispatch?`最晚寄出 ${dispatch}`:'未设置运输',end:dd(receipt),dateHint:'最终收货 DDL',rows:[{name:'运输预留',date:shipping?`${nval(shipping.step.days)} 天`:'待设置'},{name:'收货截止',date:receipt||'未定'}],tab:'production'}
 ];
 return `<section class="pane manuscript-timeline" aria-label="制品交付时间线"><div class="timeline-heading"><div><span class="eyebrow">DEADLINE MAP / 排程脉络</span><h3>从稿件到收货</h3></div><span class="timeline-note">按当前工序与活动 DDL 倒排，非实际进度百分比</span></div><div class="timeline-track">${stages.map(st=>`<article class="timeline-stage timeline-${st.code}"><div class="timeline-bar"><span class="timeline-node" aria-hidden="true"></span><span>${safe(st.caption)}</span></div><div class="timeline-stage-inner"><h4>${safe(st.title)}</h4><p class="timeline-start">${safe(st.start)}</p><div class="timeline-end"><small>${safe(st.dateHint)}</small><strong>${st.end}</strong></div><ul class="timeline-milestones">${list(st.rows,st.title)}</ul><button class="timeline-link" data-action="product-tab" data-tab="${st.tab}">查看相关环节 →</button></div></article>`).join('')}</div><p class="timeline-disclaimer">稿件按各参与内容的最后工序汇合；印厂以各生产环节倒排；邮寄从最晚寄出日衔接收货 DDL。预计日期会随工期变化，已确认的原计划与实际日期仍独立保留。</p></section>`;
}

 }).join('');
 const shared=[...p.shared].sort((a,b)=>Number(doneStep(p,a))-Number(doneStep(p,b))).map(st=>{

  return `<div class="slim-step ${complete?'step-faded':''}"><button class="slim-step-main" data-action="${mine?'task':'open-node'}" data-step="${st.id}"><span class="slim-step-name">${safe(st.name)}</span><span class="slim-step-meta">${complete?'已完成':`预计 ${nval(st.days,2)} 天 · ${plan?.shipping?'最晚寄出 '+fmtDay(plan.dispatchDate):fmtSpan(plan?.start,plan?.end)}`}</span></button><div class="slim-step-ends">${!complete&&!mine?`<button class="reminder-pill" data-action="reminder" data-step="${st.id}">提前${nval(st.remindDays,7)}天</button>`:''}<button class="slim-action" data-action="${mine?'task':'open-node'}" data-step="${st.id}">${mine?'记录':'节点'}</button></div>${ui.manageProduction?`<div class="slim-manage"><button data-action="move-step" data-product="${p.id}" data-track="shared" data-step="${st.id}" data-dir="-1">上移</button><button data-action="move-step" data-product="${p.id}" data-track="shared" data-step="${st.id}" data-dir="1">下移</button><button data-action="edit-step" data-step="${st.id}">编辑</button>${!isShippingStep(st)?`<button data-action="copy-step" data-step="${st.id}">复制</button>`:``}<button data-action="delete-step" data-step="${st.id}">删除</button><button data-action="toggle-step" data-step="${st.id}">${complete?'恢复':'完成'}</button></div>`:''}</div>`;

 return `<div class="detail-hero compact-hero"><div><div class="eyebrow">${TYPE_NAMES[p.type]||'制品'}</div><h2>${safe(p.title)}</h2><p class="page-desc">${safe(sched.event?.name||'无活动')} · 收货 DDL ${fmtDay(sched.deadline)} · 创作截稿 ${fmtDay(sched.trackDeadline)}</p></div><div class="row-end"><button class="btn sm ${data.baselines[p.id]?'soft':'primary'}" data-action="confirm-baseline" data-product="${p.id}">${data.baselines[p.id]?'重设原计划':'确认原计划'}</button><button class="btn sm" data-action="edit-product" data-product="${p.id}">基本信息</button><button class="btn sm danger" data-action="delete-product" data-product="${p.id}">删除</button></div></div>
 
 ${sched.risk.length?`<div class="alert">${icon('alert')} ${sched.risk.map(safe).join('；')}</div>`:''}
 <nav class="product-tabs" aria-label="制品详情分类">${[['overview','概览'],['content','制作内容'],['production','下印与交付'],...(p.pieces?.length?[['pieces','逐张画稿']]:[]),['logs','进度记录']].map(([tab,label])=>`<button type="button" data-action="product-tab" data-tab="${tab}" class="${ui.productTab===tab?'active':''}" aria-pressed="${ui.productTab===tab}">${label}</button>`).join('')}</nav>

function eventImpactModal(){

 if(!e||!draft)return '';
 const ps=data.products.filter(p=>p.eventId===e.id);
 const before=ps.map(p=>({p,plan:scheduleProduct(p)}));

    }
  }
  persist();closeModal();render();notify('交稿节点已更新');return;
}
 if(action==='confirm-baseline'){
   const p=productBy(ids.product),e=eventBy(p?.eventId);if(!p||!e)return;
   if(data.baselines[p.id]&&!confirm('重新确认会覆盖该制品的原计划基线。确定更新吗？'))return;
   try{data.baselines[p.id]=FandomP0Bridge.baselineFor(p,e,data.logs,todayISO());persist();render();notify('原计划基线已保存');}
   catch(err){notify('无法确认原计划：'+err.message)}return;
 }
 if(action==='save-reminder'){const v=readForm('reminder-form');if(!v)return;const ref=stepBy(ui.context?.stepId);if(!ref)return;ref.s.remindDays=Math.max(0,Math.floor(nval(v.days,7)));ref.s.nodeColor=v.nodeColor||'blue';ref.s.remindColor=v.remindColor||'yellow';persist();closeModal();render();notify('提前提醒已更新');return}
 if(action==='task'){if(!ids.step){ui.selectedProduct=ids.product;ui.view='products';render();return}openModal('log',{stepId:ids.step,date:ids.day||todayISO()});return}
 if(action==='save-log'){const v=readForm('log-form');if(!v)return;const ref=stepBy(ui.context.stepId);if(!ref)return;if(v.date>todayISO())return notify('实际进度不能填写未来日期；未来工作请在日历中查看计划');const hours=v.hours===''?0:Math.max(0,nval(v.hours));if(hours>1000)return notify('请核对今日用时');const minutes=hours*60;let amount=ref.s.kind==='quantity'?Math.max(0,nval(v.amount)):0;let pieceIds=[];
 if(ref.s.kind==='quantity'&&!ref.s.pieceStage&&stepDone(ref.p,ref.s)+amount>nval(ref.s.total)){
  if(!confirm(`预计总量为 ${cleanN(ref.s.total)} ${ref.s.unit||''}，此次录入后累计将超过目标。确定仍按实际产出保存吗？`))return;
 }
 if(ref.s.pieceStage){const avail=ref.p.pieces.filter(p=>!p[ref.s.pieceStage]);const k=Math.min(avail.length,Math.floor(amount));pieceIds=avail.slice(0,k).map(p=>p.id);if(amount>k)notify('超出剩余画稿数量，已按实际可完成数量记录');amount=k}const wasDone=!!ref.s.completed;
 const completedByLog=!!v.complete&&!wasDone&&!ref.s.pieceStage;
 if(!ref.s.pieceStage){
  if(v.complete){if(!wasDone){ref.s.completed=true;ref.s.completedAt=v.date||todayISO();}}
  else if(ref.s.completed){(ref.s.completionHistory ||= []).push({date:todayISO(),type:'reopened',previousCompletedAt:ref.s.completedAt||null});ref.s.completed=false;ref.s.completedAt=null;ref.s.completionSourceLogId=null;}
 }
 const log={id:uuid(),date:v.date||todayISO(),productId:ref.p.id,trackId:ref.t?.id||null,stepId:ref.s.id,minutes,amount,note:(v.progressText||'').trim(),pieceIds,completedByLog,createdAt:Date.now()};data.logs.push(log);if(completedByLog)ref.s.completionSourceLogId=log.id;if(ref.s.pieceStage)syncPieceProgress(ref.p);persist();ui.month=parseDay(log.date);ui.selectedDate=log.date;if(!['progress','products'].includes(ui.view))ui.view='calendar';closeModal();render();notify('进度已保存');return}
 if(action==='delete-log'){const log=data.logs.find(l=>l.id===ids.log);if(!log||!confirm('删除这条赶稿记录？'))return;const ref=stepBy(log.stepId);data.logs=data.logs.filter(x=>x.id!==log.id);
 if(ref?.s.pieceStage)syncPieceProgress(ref.p);
 if(ref&&ref.s.completionSourceLogId===log.id){ref.s.completed=false;ref.s.completedAt=null;ref.s.completionSourceLogId=null;}persist();render();return}
 if(action==='backup'){openModal('backup');return}
 if(action==='help'){openModal('help');return}
 if(action==='export'){exportData();return}
 if(action==='clear-data'){if(!confirm('清空所有活动、制品和赶稿记录？此操作不能撤销。'))return;data={events:[],products:[],logs:[],baselines:{},settings:{rates:{...DEFAULT_RATES}},schemaVersion:5};persist();closeModal();ui.view='calendar';render();return}
 if(action==='sample'){addExample();return}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='overlay'&&e.target!==el)return;e.stopPropagation();handleAction(el)});
document.addEventListener('change',async e=>{if(e.target.id==='progress-day'){ui.selectedDate=e.target.value||todayISO();render();return}if(e.target.id==='step-kind'){const kind=e.target.value;document.getElementById('qty-fields').classList.toggle('hide',kind!=='quantity');document.getElementById('duration-fields').classList.toggle('hide',kind==='quantity')}if(e.target.name==='unit'&&e.target.closest('#step-form')){const f=e.target.closest('form'),select=f?.querySelector('[name=rateKey]');if(select){const unit=e.target.value.trim();select.value=unit==='字'?'chars1000':unit==='P'?'otherP':unit==='张'?'otherSheet':'otherUnit'}}if(e.target.name==='isMine'&&e.target.closest('#step-form'))document.getElementById('reminder-settings')?.classList.toggle('hide',e.target.checked)
});
render();
if(!data.events.length&&!data.products.length)setTimeout(()=>openModal('event'),200);
</script>
</body>
